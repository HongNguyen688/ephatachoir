      <nav class="navbar">
        <a href="./index.html">

        >

    <div class="page-wrapper">
      <section class="hero">
        <div class="container" style="text-align: center">
          <h1 class="super-title">Lời Ca Tiếng Hát</h1>
          <p style="font-size: 1.5rem; color: #fff9f5; margin: 1rem 0">
            Những giai điệu thánh ca do chính anh chị em ca đoàn Ephata trình
            bày

      <main class="container">
        <div class="songs-youtube-grid" id="performances-grid">
          <!-- Videos will be loaded here dynamically -->
        </div>

        <div id="pagination" class="pagination"></div>

      <div class="footer-push"></div>
    </div>

    <footer>© 2025 HN – CĐ Ephata San Jose</footer>

    <script src="./statics/js/index.js" defer></script>
    <script>
      function getYouTubeId(url) {
        if (!url) return '';
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : url;
      }

      async function loadPerformances() {
        try {
          const response = await fetch('data/performances.json');
          const data = await response.json();
          const grid = document.getElementById('performances-grid');
          
          // Use the key 'performances' as defined in config.yml
          const items = data.performances || [];
          
          if (items.length > 0) {
            grid.innerHTML = items.map(item => `
              <div class="yt-item">
                <div class="yt-thumbnail">
                  <iframe
                    src="https://www.youtube.com/embed/${getYouTubeId(item.youtube_url)}"
                    title="${item.title}"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen
                  ></iframe>
                </div>
                <div class="yt-info">
                  <h3>${item.title}</h3>
                </div>
              </div>
            `).join('');
          } else {
            grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">Chưa có video nào. Vui lòng thêm video trong trang Admin.</p>';
          }
        } catch (error) {
          console.error('Error loading performances:', error);
          const grid = document.getElementById('performances-grid');
          grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">Có lỗi xảy ra khi tải dữ liệu.</p>';
        }
      }
      document.addEventListener('DOMContentLoaded', loadPerformances);
    </script>
  </body>
</html>
