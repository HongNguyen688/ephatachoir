<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="./statics/images/logo.png" />

    <title>CĐ Ephata - San Jose</title>
    <link rel="stylesheet" href="./statics/css/style.css" />
    <link rel="stylesheet" href="./statics/css/responsive.css" />
    <link rel="stylesheet" href="./statics/css/life.css">
  </head>
  <body>
    <header>
      <nav class="navbar">
        <a href="./index.html">
          <div class="logo">
            <div>
              <img alt="CĐ Ephata Logo" src="./statics/images/logo.png" />
            </div>
            <div><p>CĐ Ephata</p></div>
          </div></a
        >
        <ul class="nav-menu">
          <li><a href="./index.html">Trang Chủ</a></li>
          <li><a href="./weeklysongs.html">Bài Hát Hàng Tuần</a></li>
          <li><a href="./performance.html">Lời Ca Tiếng Hát</a></li>
          <li><a href="./life.html">Đời Sống</a></li>
          <li><a href="./about.html">Giới Thiệu</a></li>
        </ul>
        <div class="hamburger">☰</div>
      </nav>
    </header>

    <section class="hero">
      <div class="container" style="text-align:center">
        <h1>Ca Đoàn Ephata</h1>
        <p>Những khoảnh khắc đẹp bên nhau trong hành trình đức tin</p>
      </div>
    </section>

      <main class="container">
        <h2 style="text-align: center; margin: 3rem 0 2rem">
          Bộ Sưu Tập Hình Ảnh
        </h2>
        <div class="gallery-grid" id="gallery-grid">
          <!-- Gallery items will be loaded here dynamically -->
        </div>

        <div id="pagination" class="pagination"></div>
      </main>
      <div class="footer-push"></div>
    </div>

    <footer>© 2025 HN - CĐ Ephata - San Jose</footer>
    <script src="./statics/js/index.js" defer></script>
    <script>
      async function loadGallery() {
        try {
          const response = await fetch('data/life.json');
          const data = await response.json();
          const grid = document.getElementById('gallery-grid');
          
          const items = data.images || [];
          
          if (items.length > 0) {
            grid.innerHTML = items.map(item => `
              <figure class="gallery-item">
                <img
                  src="${item.image}"
                  alt="${item.caption || 'Hình ảnh ca đoàn'}"
                  loading="lazy"
                />
                <figcaption>${item.caption || ''}</figcaption>
              </figure>
            `).join('');
          } else {
            grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">Chưa có hình ảnh nào.</p>';
          }
        } catch (error) {
          console.error('Error loading gallery:', error);
        }
      }
      document.addEventListener('DOMContentLoaded', loadGallery);
    </script>
  </body>
</html>

  </body>
</html>
